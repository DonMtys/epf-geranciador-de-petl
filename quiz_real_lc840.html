<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz Questões Reais — LC 840/2011</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0d1117; color: #e6edf3; font-family: 'Segoe UI', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
h1 { font-size: 1.4rem; color: #58a6ff; margin-bottom: 4px; }
.sub { color: #8b949e; font-size: .85rem; margin-bottom: 16px; text-align: center; }
.filter-section { width: 100%; max-width: 640px; margin-bottom: 12px; }
.filter-label { color: #8b949e; font-size: .8rem; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px; }
.controls { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.controls label { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 5px 10px; font-size: .78rem; cursor: pointer; display: flex; align-items: center; gap: 5px; }
.controls label:hover { border-color: #58a6ff; }
.controls input[type=checkbox] { accent-color: #58a6ff; }
.btn-start { background: #238636; color: #fff; border: none; border-radius: 8px; padding: 10px 28px; font-size: 1rem; cursor: pointer; margin-top: 8px; }
.btn-start:hover { background: #2ea043; }
#game { display: none; width: 100%; max-width: 640px; }
.score-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: .88rem; color: #8b949e; }
#num-badge { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 4px 10px; font-size: .8rem; }
.timer-wrap { height: 5px; background: #21262d; border-radius: 3px; margin-bottom: 14px; }
#timer-bar { height: 5px; border-radius: 3px; background: #3fb950; transition: width 1s linear, background .5s; }
.card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; margin-bottom: 12px; }
.meta { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.badge { font-size: .7rem; padding: 2px 8px; border-radius: 10px; border: 1px solid; }
.badge-banca { border-color: #58a6ff; color: #58a6ff; background: rgba(88,166,255,.1); }
.badge-bloco { border-color: #8b949e; color: #8b949e; background: transparent; }
.question { font-size: 1rem; line-height: 1.6; }
.opts { display: flex; gap: 12px; margin-top: 14px; }
.opt { flex: 1; background: #0d1117; border: 2px solid #30363d; border-radius: 8px; padding: 14px; text-align: center; font-size: 1rem; font-weight: 700; cursor: pointer; transition: .15s; }
.opt:hover:not(:disabled) { border-color: #58a6ff; color: #58a6ff; }
.opt.correct { border-color: #3fb950; background: rgba(63,185,80,.15); color: #3fb950; }
.opt.wrong { border-color: #f85149; background: rgba(248,81,73,.15); color: #f85149; }
.opt:disabled { cursor: default; }
.feedback { margin-top: 12px; padding: 12px 14px; border-radius: 8px; font-size: .88rem; line-height: 1.5; display: none; }
.feedback.show { display: block; }
.feedback.ok { background: rgba(63,185,80,.1); border: 1px solid #3fb950; color: #3fb950; }
.feedback.nok { background: rgba(248,81,73,.1); border: 1px solid #f85149; color: #f85149; }
.art-ref { font-size: .78rem; opacity: .8; margin-bottom: 4px; }
.btn-next { display: none; width: 100%; padding: 11px; background: #1f6feb; border: none; border-radius: 8px; color: #fff; font-size: .95rem; cursor: pointer; margin-top: 10px; }
.btn-next:hover { background: #388bfd; }
.btn-next.show { display: block; }
#result { display: none; text-align: center; padding: 30px; max-width: 640px; width: 100%; }
#result h2 { font-size: 1.6rem; margin-bottom: 8px; }
.score-big { font-size: 3rem; font-weight: 700; color: #58a6ff; margin: 12px 0; }
.score-label { color: #8b949e; margin-bottom: 20px; }
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0; }
.stat-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px; }
.stat-val { font-size: 1.4rem; font-weight: 700; color: #58a6ff; }
.stat-lbl { font-size: .75rem; color: #8b949e; margin-top: 2px; }
.btn-retry { background: #238636; color: #fff; border: none; border-radius: 8px; padding: 12px 24px; font-size: .95rem; cursor: pointer; margin: 6px; }
.btn-retry:hover { background: #2ea043; }
.btn-wrongs { background: #b62324; color: #fff; border: none; border-radius: 8px; padding: 12px 24px; font-size: .95rem; cursor: pointer; margin: 6px; }
</style>
</head>
<body>
<h1>📋 Quiz Questões Reais</h1>
<p class="sub">LC 840/2011 — 193 questões de prova • QUADRIX · CEBRASPE · IADES · IBFC · FCC<br>Timer 30s por questão</p>

<div id="setup" style="width:100%;max-width:640px">
  <div class="filter-section">
    <div class="filter-label">Banca</div>
    <div class="controls filter-bancas">
      <label><input type="checkbox" value="CEBRASPE" checked> CEBRASPE</label>
    <label><input type="checkbox" value="FCC" checked> FCC</label>
    <label><input type="checkbox" value="IADES" checked> IADES</label>
    <label><input type="checkbox" value="IBFC" checked> IBFC</label>
    <label><input type="checkbox" value="QUADRIX" checked> QUADRIX</label>
    </div>
    <div class="filter-label" style="margin-top:10px">Bloco</div>
    <div class="controls filter-blocos">
      <label><input type="checkbox" value="Arts. 4–54" checked> Arts. 4–54</label>
    <label><input type="checkbox" value="Arts. 55–65" checked> Arts. 55–65</label>
    <label><input type="checkbox" value="Arts. 66–179" checked> Arts. 66–179</label>
    </div>
  </div>
  <div style="text-align:center">
    <button class="btn-start" onclick="startGame('all')">▶ Iniciar</button>
  </div>
</div>

<div id="game">
  <div class="score-bar">
    <span>Acertos: <span id="score-val" style="color:#3fb950">0</span></span>
    <span id="num-badge">1 / 193</span>
  </div>
  <div class="timer-wrap"><div id="timer-bar" style="width:100%"></div></div>
  <div class="card">
    <div class="meta">
      <span class="badge badge-banca"></span>
      <span class="badge badge-bloco"></span>
    </div>
    <div class="question"></div>
    <div class="opts"></div>
    <div class="feedback"></div>
    <button class="btn-next" onclick="nextQuestion()">Próximo →</button>
  </div>
</div>

<div id="result">
  <h2></h2>
  <div class="score-big"></div>
  <div class="score-label"></div>
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-val" id="stat-wrong"></div><div class="stat-lbl">Erros</div></div>
    <div class="stat-card"><div class="stat-val" id="stat-pct"></div><div class="stat-lbl">Aproveitamento</div></div>
  </div>
  <button class="btn-retry" onclick="retryAll()">↩ Novo simulado</button>
  <button class="btn-wrongs" id="btn-wrongs" onclick="retryWrongs()" style="display:none">🔁 Rever erros</button>
</div>

<script>
const QUESTOES = [{"banca": "QUADRIX", "bloco": "Arts. 4–54", "q": "O servidor público civil do Distrito Federal que tenha sido investido em mandato eletivo poderá cumular a remuneração do cargo efetivo com os subsídios do mandato, independentemente do cargo que ocupe.", "opts": ["Certo", "Errado"], "a": 1, "art": "Art. 55", "tip": "Regra: afastamento sem remuneração do cargo. Exceção: se o mandato for de vereador e houver compatibilidade de horários, pode cumular."}, {"banca": "QUADRIX", "bloco": "Arts. 4–54", "q": "O servidor que tiver cometido falta grave, punida com demissão, terá direito à contagem do tempo de serviço prestado antes da demissão para efeito de aposentadoria.", "opts": ["Certo", "Errado"], "a": 1, "art": "Art. 203", "tip": "A demissão por falta grave (crime, improbidade, acumulação ilegal etc.) acarreta a perda do cargo sem indenização e sem aproveitamento do tempo para aposentadoria."}, {"banca": "QUADRIX", "bloco": "Arts. 4–54", "q": "A estabilidade do servidor público efetivo do DF é adquirida após três anos de efetivo exercício, sendo exigida aprovação em avaliação especial de desempenho.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 32", "tip": "3 anos + aprovação na avaliação especial de desempenho = estabilidade."}, {"banca": "QUADRIX", "bloco": "Arts. 4–54", "q": "O cargo em comissão pode ser provido por pessoa estranha aos quadros do serviço público, sem necessidade de aprovação em concurso público, pois é de livre nomeação e exoneração.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 9º", "tip": "Cargo em comissão: livre nomeação e exoneração, pode ser ocupado por qualquer pessoa. Porém 70% devem ser servidores de carreira."}, {"banca": "CEBRASPE", "bloco": "Arts. 4–54", "q": "A nomeação para cargo de provimento efetivo depende de prévia habilitação em concurso público de provas ou de provas e títulos, observada a ordem de classificação.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 11, §1º", "tip": "Concurso público → nomeação por ordem de classificação."}, {"banca": "CEBRASPE", "bloco": "Arts. 4–54", "q": "O servidor nomeado para cargo de provimento efetivo tem o prazo de trinta dias para tomar posse, contado da publicação do ato de nomeação.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 17, §1º", "tip": "Posse = 30 dias. Não tomando posse, o ato de nomeação é tornado sem efeito."}, {"banca": "CEBRASPE", "bloco": "Arts. 4–54", "q": "Ao servidor empossado é concedido o prazo de dez dias úteis para entrar em exercício, a contar da data da posse.", "opts": ["Certo", "Errado"], "a": 1, "art": "Art. 19, §2º", "tip": "Exercício = 5 dias úteis (não 10)."}, {"banca": "IADES", "bloco": "Arts. 4–54", "q": "O concurso público terá validade de até dois anos, podendo ser prorrogado uma única vez, por igual período.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 12", "tip": "Validade: até 2 anos, prorrogável 1 vez por igual período (máx 4 anos)."}, {"banca": "IADES", "bloco": "Arts. 4–54", "q": "Pelo menos cinquenta por cento dos cargos em comissão deverão ser reservados aos servidores de carreira.", "opts": ["Certo", "Errado"], "a": 1, "art": "Art. 10, §1º", "tip": "O percentual correto é 70%, não 50%."}, {"banca": "IBFC", "bloco": "Arts. 4–54", "q": "O servidor público efetivo do Distrito Federal que seja aprovado em outro concurso público poderá tomar posse e exercer o novo cargo sem ser exonerado do cargo anterior, desde que haja compatibilidade de horários.", "opts": ["Certo", "Errado"], "a": 1, "art": "Art. 47", "tip": "A acumulação de cargos efetivos só é permitida nos casos expressos da CF/88: dois cargos de professor, professor + técnico/científico, ou dois cargos de saúde com profissões regulamentadas."}, {"banca": "QUADRIX", "bloco": "Arts. 4–54", "q": "A readaptação é a investidura do servidor em cargo de atribuições e responsabilidades compatíveis com a limitação que tenha sofrido em sua capacidade física ou mental.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 42", "tip": "Readaptação: limitação de capacidade física ou mental verificada em inspeção médica."}, {"banca": "QUADRIX", "bloco": "Arts. 4–54", "q": "A posse em cargo público poderá dar-se mediante procuração específica, desde que o instrumento de mandato contenha os poderes expressos para esse fim.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 18, §3º", "tip": "Admite-se posse por procuração específica com poderes expressos."}, {"banca": "CEBRASPE", "bloco": "Arts. 4–54", "q": "O subsídio consiste em parcela única que reúne todas as espécies remuneratórias, sendo vedado o acréscimo de qualquer gratificação, adicional, abono, prêmio, verba de representação ou outra espécie remuneratória.", "opts": ["Certo", "Errado"], "a": 1, "art": "Art. 71", "tip": "Mesmo em regime de subsídio, são permitidos adicionais como diárias, ajuda de custo, auxílio-alimentação e auxílio-moradia."}, {"banca": "CEBRASPE", "bloco": "Arts. 4–54", "q": "Ao servidor que acumular licitamente dois cargos efetivos será assegurada a aplicação do regime de subsídio em ambos, quando cabível.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 71, §2º", "tip": "Acumulação lícita: aplica-se o regime de cada cargo separadamente."}, {"banca": "IADES", "bloco": "Arts. 4–54", "q": "A remuneração do servidor não poderá ser inferior ao salário mínimo.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 72", "tip": "O vencimento não pode ser inferior ao salário mínimo (CF/88, art. 7º, IV, c/c art. 39, §3º)."}, {"banca": "IADES", "bloco": "Arts. 4–54", "q": "O servidor tem direito ao recebimento da diferença de remuneração quando designado para substituir temporariamente cargo de maior nível.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 78", "tip": "Substituição: direito à diferença de remuneração entre os cargos."}, {"banca": "QUADRIX", "bloco": "Arts. 4–54", "q": "As vantagens pecuniárias não poderão ser computadas nem acumuladas para fins de concessão de acréscimos ulteriores.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 80", "tip": "Vedado o \"cascateamento\" de vantagens sobre vantagens."}, {"banca": "QUADRIX", "bloco": "Arts. 4–54", "q": "O adicional de insalubridade no grau máximo corresponde a quarenta por cento sobre o vencimento básico.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 88", "tip": "Insalubridade: mínimo 10%, médio 20%, máximo 40%. Grau máximo = 40%."}, {"banca": "CEBRASPE", "bloco": "Arts. 4–54", "q": "O adicional de periculosidade é de vinte e cinco por cento sobre o vencimento básico do servidor.", "opts": ["Certo", "Errado"], "a": 1, "art": "Art. 89", "tip": "Adicional de periculosidade = 30% (não 25%). 25% é o adicional noturno."}, {"banca": "CEBRASPE", "bloco": "Arts. 4–54", "q": "A hora de trabalho noturno, compreendida entre vinte e duas horas e cinco horas, terá duração de cinquenta e dois minutos e trinta segundos.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 85, §2º", "tip": "Hora noturna = 52min30s (menor que a diurna de 60min)."}, {"banca": "IADES", "bloco": "Arts. 4–54", "q": "O servidor terá direito ao recebimento de adicionais de insalubridade e de periculosidade simultaneamente, quando as atividades exercidas assim o justificarem.", "opts": ["Certo", "Errado"], "a": 1, "art": "Art. 88, §2º", "tip": "Os adicionais de insalubridade e periculosidade NÃO são cumuláveis; o servidor opta pelo mais favorável."}, {"banca": "IADES", "bloco": "Arts. 4–54", "q": "O servidor que acumular regularmente dois cargos tem direito a dois adicionais de insalubridade quando ambos os cargos expuserem o servidor a condições insalubres.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 88, §3º", "tip": "Na acumulação lícita: cada cargo é avaliado de forma independente."}, {"banca": "QUADRIX", "bloco": "Arts. 4–54", "q": "A gratificação natalina será paga até o dia vinte de dezembro, no valor correspondente a um doze avos da remuneração devida no mês de dezembro, por mês trabalhado.", "opts": ["Certo", "Errado"], "a": 1, "art": "Art. 93", "tip": "Gratificação natalina: paga até 20 de dezembro, mas o valor é 1/12 por mês DE EFETIVO EXERCÍCIO (não por mês trabalhado quando há afastamentos sem remuneração)."}, {"banca": "QUADRIX", "bloco": "Arts. 4–54", "q": "O servidor que completar 25 anos de efetivo exercício no serviço público do Distrito Federal faz jus a adicional por tempo de serviço de cinco por cento.", "opts": ["Certo", "Errado"], "a": 1, "art": "Art. 82", "tip": "O adicional por tempo de serviço é de 1% a cada ano completo de efetivo exercício, até o limite de 35% (não 5% após 25 anos)."}, {"banca": "CEBRASPE", "bloco": "Arts. 4–54", "q": "O servidor somente receberá diárias quando se afastar da sede em serviço, por mais de um dia, ressalvados os casos de afastamento para o exterior.", "opts": ["Certo", "Errado"], "a": 1, "art": "Art. 100", "tip": "Diárias: também são devidas quando houver necessidade de pernoite, mesmo que seja num único dia."}, {"banca": "CEBRASPE", "bloco": "Arts. 4–54", "q": "O servidor em estágio probatório pode ser cedido a outro órgão ou entidade para prestar serviços.", "opts": ["Certo", "Errado"], "a": 1, "art": "Art. 22, §§", "tip": "Servidor em estágio probatório não pode ser cedido, pois precisa estar no exercício de suas funções para ser avaliado."}, {"banca": "IADES", "bloco": "Arts. 4–54", "q": "O auxílio-alimentação será devido aos servidores em atividade, vedado seu pagamento em dobro ou em forma diversa do estabelecido em lei.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 107", "tip": "Auxílio-alimentação: apenas em atividade, vedado pagamento em dobro."}, {"banca": "IBFC", "bloco": "Arts. 4–54", "q": "O servidor ocupante de cargo em comissão ou função de confiança tem jornada de quarenta horas semanais, com integral dedicação ao serviço.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 58", "tip": "CC/FC = 40h semanais, integral dedicação."}, {"banca": "QUADRIX", "bloco": "Arts. 4–54", "q": "A designação para exercer funções de chefia, direção e assessoramento não altera o cargo efetivo do servidor nem lhe acarreta alteração de vencimento.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 59, §1º", "tip": "Função de confiança não muda o cargo efetivo, acrescenta apenas a gratificação de função."}, {"banca": "QUADRIX", "bloco": "Arts. 4–54", "q": "A prestação de serviço extraordinário será permitida somente em situações excepcionais e temporárias, sendo limitada a duas horas por jornada.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 60", "tip": "Serviço extraordinário: situações excepcionais e temporárias, limite de 2h extras/dia."}, {"banca": "CEBRASPE", "bloco": "Arts. 4–54", "q": "O servidor público civil efetivo do DF não pode ser exonerado de ofício durante o período de gravidez, até cinco meses após o parto, exceto se estiver em cargo comissionado.", "opts": ["Certo", "Errado"], "a": 1, "art": "Art. 53", "tip": "A proteção de 5 meses após o parto se aplica TAMBÉM ao cargo em comissão (não é exceção, é a regra para comissionados)."}, {"banca": "CEBRASPE", "bloco": "Arts. 4–54", "q": "A servidora grávida em estágio probatório não pode ser exonerada durante a gravidez e até cinco meses após o parto.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 53", "tip": "A proteção se aplica a todas as servidoras, incluindo as em estágio probatório."}, {"banca": "IADES", "bloco": "Arts. 4–54", "q": "A acumulação de cargos públicos é proibida, exceto nos casos de dois cargos de professor, de um cargo de professor com outro técnico ou científico e de dois cargos privativos de profissionais de saúde com profissões regulamentadas.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 47", "tip": "Exceções constitucionais à vedação de acumulação."}, {"banca": "IADES", "bloco": "Arts. 4–54", "q": "O servidor em atividade que estiver respondendo a processo penal instaurado em virtude do exercício de suas funções ficará afastado preventivamente do cargo durante toda a instrução criminal.", "opts": ["Certo", "Errado"], "a": 1, "art": "Art. 222", "tip": "O afastamento preventivo é medida disciplinar (não penal), dura no máximo 60+60 dias, não necessariamente durante toda a instrução criminal."}, {"banca": "QUADRIX", "bloco": "Arts. 4–54", "q": "A proibição de acumular cargos, empregos e funções públicas estende-se a empregos e funções em autarquias, fundações públicas, empresas públicas, sociedades de economia mista e suas subsidiárias.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 47, §único", "tip": "A vedação de acumulação abrange toda a Administração Direta e Indireta."}, {"banca": "QUADRIX", "bloco": "Arts. 4–54", "q": "O servidor investido em mandato de vereador, havendo compatibilidade de horários, poderá acumular os vencimentos de ambos os cargos.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 55, II", "tip": "Única exceção de acumulação remuneratória com mandato eletivo: vereador com compatibilidade de horários."}, {"banca": "CEBRASPE", "bloco": "Arts. 4–54", "q": "O servidor público efetivo em atividade que seja eleito para cargo de chefe do Poder Executivo ficará afastado do cargo durante o exercício do mandato, fazendo jus aos vencimentos do cargo efetivo.", "opts": ["Certo", "Errado"], "a": 1, "art": "Art. 55, I", "tip": "Chefe do Executivo eleito: afastamento SEM remuneração do cargo efetivo (opta pelo subsídio do mandato)."}, {"banca": "CEBRASPE", "bloco": "Arts. 4–54", "q": "O servidor que tiver assumido mandato de deputado federal ou estadual será afastado do cargo, sendo-lhe facultado optar pela remuneração do cargo efetivo.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 55, III", "tip": "Deputado/Senador: afastado do cargo, pode optar pela remuneração do cargo efetivo."}, {"banca": "IADES", "bloco": "Arts. 4–54", "q": "A reversão é o retorno à atividade do servidor aposentado por invalidez, quando insubsistentes os motivos determinantes da aposentadoria.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 34, I", "tip": "Reversão por invalidez: laudo médico constata que cessou a incapacidade."}, {"banca": "IADES", "bloco": "Arts. 4–54", "q": "A reintegração é a reinvestidura do servidor estável no cargo anteriormente ocupado, ou no cargo resultante de sua transformação, quando invalidada a demissão por decisão administrativa ou judicial.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 36", "tip": "Reintegração: demissão invalidada → reinvestidura no cargo."}, {"banca": "IBFC", "bloco": "Arts. 4–54", "q": "A recondução é o retorno do servidor estável ao cargo anteriormente ocupado, decorrente de inabilitação em estágio probatório relativo a outro cargo ou reintegração do anterior ocupante.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 37", "tip": "Recondução: inabilitação no estágio probatório do novo cargo ou reintegração do anterior ocupante."}, {"banca": "QUADRIX", "bloco": "Arts. 4–54", "q": "O servidor em disponibilidade remunerada que não aceitar o cargo oferecido em aproveitamento, por inadequação de atribuições, continuará recebendo normalmente a remuneração proporcional.", "opts": ["Certo", "Errado"], "a": 1, "art": "Art. 40", "tip": "Se o servidor recusar o aproveitamento sem motivo justificado, cessa a disponibilidade. A recusa injustificada = demissão."}, {"banca": "QUADRIX", "bloco": "Arts. 4–54", "q": "A transferência consiste na passagem do servidor de um quadro para outro de poder diferente, com ou sem mudança de sede.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 41", "tip": "Transferência: mudança de quadro/poder, com ou sem mudança de sede."}, {"banca": "CEBRASPE", "bloco": "Arts. 4–54", "q": "A exoneração de ofício dar-se-á quando não satisfeitas as condições do estágio probatório ou quando, tendo tomado posse, o servidor não entrar em exercício no prazo legal.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 45, I e II", "tip": "Exoneração de ofício: não satisfez estágio probatório ou não entrou em exercício."}, {"banca": "CEBRASPE", "bloco": "Arts. 4–54", "q": "A demissão é sempre aplicada como penalidade, não podendo ocorrer de forma espontânea pelo servidor.", "opts": ["Certo", "Errado"], "a": 1, "art": "Art. 45 e 203", "tip": "Demissão ocorre como penalidade disciplinar, mas também pode ser ato voluntário (pedido de demissão). Exoneração é o afastamento voluntário."}, {"banca": "IADES", "bloco": "Arts. 4–54", "q": "A cassação de aposentadoria ou disponibilidade é a penalidade aplicada ao servidor aposentado que teria sido demitido se estivesse em atividade.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 205", "tip": "Cassação = demissão equivalente para aposentado ou servidor em disponibilidade."}, {"banca": "IADES", "bloco": "Arts. 4–54", "q": "A destituição de cargo em comissão é aplicada nos casos em que a infração praticada pelo comissionado seria punida com demissão, caso ocupasse cargo efetivo.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 206", "tip": "Destituição = demissão equivalente para ocupante de cargo em comissão."}, {"banca": "IBFC", "bloco": "Arts. 4–54", "q": "A reserva de vagas para candidatos com deficiência no concurso público deverá ser de no mínimo vinte por cento das vagas oferecidas no edital.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 13", "tip": "PCD = 20% das vagas, desprezada a parte decimal."}, {"banca": "QUADRIX", "bloco": "Arts. 4–54", "q": "O processo de remoção do servidor independe de interesse e requerimento do servidor, podendo ocorrer de ofício pela Administração.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 50", "tip": "Remoção pode ser de ofício (interesse da Administração), a pedido ou por permuta."}, {"banca": "QUADRIX", "bloco": "Arts. 4–54", "q": "É vedada a cessão de servidor do DF para órgãos ou entidades de outro ente federativo.", "opts": ["Certo", "Errado"], "a": 1, "art": "Art. 51", "tip": "Cessão é permitida para órgãos de outros entes, desde que haja interesse da Administração Pública."}, {"banca": "QUADRIX", "bloco": "Arts. 55–65", "q": "O servidor público tem direito ao exercício de mandato classista como representante de entidade sindical, sem prejuízo de sua remuneração.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 63, §1º", "tip": "Mandato classista: afastamento com remuneração."}, {"banca": "QUADRIX", "bloco": "Arts. 55–65", "q": "O servidor é obrigado a assinar o termo de responsabilidade por equipamentos, materiais e locais de trabalho que lhe forem confiados.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 56, XXV", "tip": "Dever do servidor: zelar e assinar responsabilidade por bens públicos."}, {"banca": "CEBRASPE", "bloco": "Arts. 55–65", "q": "A recusa do servidor em participar de sindicância ou processo administrativo disciplinar é punida com demissão.", "opts": ["Certo", "Errado"], "a": 1, "art": "Art. 57", "tip": "Recusa a sindicância = infração, mas punição é proporcional à gravidade — pode ser advertência ou suspensão, não necessariamente demissão."}, {"banca": "CEBRASPE", "bloco": "Arts. 55–65", "q": "É vedado ao servidor público do Distrito Federal exercer qualquer atividade comercial enquanto estiver no exercício de cargo público.", "opts": ["Certo", "Errado"], "a": 1, "art": "Art. 57", "tip": "A vedação é para atividades incompatíveis com o cargo ou que possam prejudicar o serviço. Atividades privadas lícitas e compatíveis são permitidas fora do horário de serviço."}, {"banca": "IADES", "bloco": "Arts. 55–65", "q": "O abandono de cargo ocorre quando o servidor se ausenta do serviço por mais de trinta dias consecutivos, sem autorização.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 64, I", "tip": "Abandono: +30 dias CONSECUTIVOS de ausência injustificada."}, {"banca": "IADES", "bloco": "Arts. 55–65", "q": "Configura inassiduidade habitual a ausência injustificada do servidor ao serviço por sessenta dias, interpolados, durante doze meses.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 64, II", "tip": "Inassiduidade: +60 dias INTERPOLADOS em 12 meses."}, {"banca": "IBFC", "bloco": "Arts. 55–65", "q": "O servidor tem direito de se ausentar do serviço sem prejuízo da remuneração pelo prazo de até oito dias consecutivos em virtude de casamento.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 62, III", "tip": "Casamento = 8 dias consecutivos (incluindo o dia do evento)."}, {"banca": "QUADRIX", "bloco": "Arts. 55–65", "q": "O servidor tem direito de ausentar-se do serviço por dois dias para realizar alistamento eleitoral.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 62, II", "tip": "Alistamento ou transferência eleitoral = 2 dias."}, {"banca": "QUADRIX", "bloco": "Arts. 55–65", "q": "O servidor tem direito a um dia por ano para realizar exame preventivo de câncer.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 62, I", "tip": "Exame preventivo de câncer = 1 dia, 1 vez por ano."}, {"banca": "CEBRASPE", "bloco": "Arts. 55–65", "q": "O servidor que acumular ilicitamente dois cargos será notificado para apresentar opção por um dos cargos, no prazo improrrogável de quinze dias.", "opts": ["Certo", "Errado"], "a": 1, "art": "Art. 48", "tip": "Prazo para opção na acumulação ilegal = 10 dias IMPRORROGÁVEIS (não 15)."}, {"banca": "CEBRASPE", "bloco": "Arts. 55–65", "q": "A cessão do servidor é possível para órgão ou entidade que não integre a Administração Pública, quando do interesse do Distrito Federal.", "opts": ["Certo", "Errado"], "a": 1, "art": "Art. 51", "tip": "Cessão: somente para órgãos ou entidades da Administração Pública (direta e indireta), não para entidades privadas em geral."}, {"banca": "IADES", "bloco": "Arts. 66–179", "q": "A jornada de trabalho do servidor efetivo do Distrito Federal é, em regra, de trinta horas semanais.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 57", "tip": "Efetivo = 30h semanais. CC/FC = 40h semanais."}, {"banca": "IADES", "bloco": "Arts. 66–179", "q": "O serviço extraordinário será remunerado com acréscimo de cinquenta por cento em relação à hora normal de trabalho.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 84", "tip": "Adicional de hora extra = 50%."}, {"banca": "IBFC", "bloco": "Arts. 66–179", "q": "O servidor tem direito a férias anuais de trinta dias, a cada doze meses de efetivo exercício.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 125", "tip": "Férias = 30 dias por 12 meses de efetivo exercício."}, {"banca": "QUADRIX", "bloco": "Arts. 66–179", "q": "As férias do servidor público do Distrito Federal podem ser parceladas em até três etapas, não podendo nenhuma ser inferior a dez dias.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 125, §5º", "tip": "Parcelamento: até 3 etapas, mínimo de 10 dias cada."}, {"banca": "QUADRIX", "bloco": "Arts. 66–179", "q": "As férias podem ser acumuladas em até dois períodos consecutivos, por necessidade do serviço.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 125, §4º", "tip": "Acumulação: até 2 períodos, por necessidade do serviço."}, {"banca": "CEBRASPE", "bloco": "Arts. 66–179", "q": "O servidor tem direito ao pagamento em dobro da remuneração em caso de férias vencidas não gozadas por necessidade do serviço.", "opts": ["Certo", "Errado"], "a": 1, "art": "Art. 125", "tip": "Não há previsão de pagamento em dobro por férias vencidas na LC 840. O servidor tem direito a gozar as férias acumuladas."}, {"banca": "CEBRASPE", "bloco": "Arts. 66–179", "q": "O abono pecuniário de férias, equivalente a um terço da remuneração de férias, pode ser requerido pelo servidor no prazo de até sessenta dias antes do início do período de férias.", "opts": ["Certo", "Errado"], "a": 1, "art": "Art. 125", "tip": "A LC 840 não prevê expressamente \"abono pecuniário\" com conversão de 1/3. O adicional constitucional de 1/3 é um direito adicional na remuneração de férias."}, {"banca": "IADES", "bloco": "Arts. 66–179", "q": "A licença para tratamento de saúde será concedida com base em perícia médica, sem qualquer limitação de prazo.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 131", "tip": "Licença saúde: concedida por perícia médica, sem limite de prazo enquanto durar a incapacidade."}, {"banca": "IADES", "bloco": "Arts. 66–179", "q": "A licença por motivo de doença em pessoa da família é concedida ao servidor com remuneração por até trinta dias por período, podendo atingir cento e oitenta dias por ano.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 134, §3º", "tip": "Doença em familiar: 30 dias/período com remuneração, máx 180 dias/ano."}, {"banca": "IBFC", "bloco": "Arts. 66–179", "q": "A licença à gestante é de cento e oitenta dias, podendo ser antecipada em até vinte e oito dias antes da data prevista para o parto.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 149-A", "tip": "Licença-maternidade = 180 dias, antecipável em até 28 dias."}, {"banca": "QUADRIX", "bloco": "Arts. 66–179", "q": "A licença-paternidade tem duração de dez dias úteis.", "opts": ["Certo", "Errado"], "a": 1, "art": "Art. 150", "tip": "Licença-paternidade = 7 dias CONSECUTIVOS (não 10 dias úteis)."}, {"banca": "QUADRIX", "bloco": "Arts. 66–179", "q": "A licença para acompanhar cônjuge ou companheiro que for deslocado para outro ponto do território nacional ou para o exterior será concedida sem remuneração, por prazo indefinido.", "opts": ["Certo", "Errado"], "a": 1, "art": "Art. 133, §1º", "tip": "Licença acompanhar cônjuge: sem remuneração, por ATÉ 5 ANOS (não prazo indefinido)."}, {"banca": "CEBRASPE", "bloco": "Arts. 66–179", "q": "A licença para o serviço militar será concedida ao servidor convocado ou designado para o serviço ativo das Forças Armadas, sendo vedado o afastamento de servidor em estágio probatório para tal fim.", "opts": ["Certo", "Errado"], "a": 1, "art": "Art. 136", "tip": "Licença para serviço militar aplica-se a todos os servidores, inclusive os em estágio probatório. É uma obrigação constitucional, não pode ser negada."}, {"banca": "CEBRASPE", "bloco": "Arts. 66–179", "q": "A licença para atividade política, no período compreendido entre o registro da candidatura e o décimo dia seguinte ao da eleição, será com remuneração.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 137, §1º", "tip": "Do registro até 10 dias após eleição = COM remuneração."}, {"banca": "IADES", "bloco": "Arts. 66–179", "q": "A licença para capacitação poderá ser concedida ao servidor que contar com pelo menos cinco anos de efetivo exercício, para participar de ações de capacitação.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 140", "tip": "Licença capacitação: mínimo 5 anos de efetivo exercício."}, {"banca": "IADES", "bloco": "Arts. 66–179", "q": "A licença para tratar de interesses particulares será concedida ao servidor estável, por até três anos, podendo ser prorrogada uma vez por igual período.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 144", "tip": "Interesses particulares: até 3 anos + prorrogação de mais 3 anos (total máx: 6 anos)."}, {"banca": "IBFC", "bloco": "Arts. 66–179", "q": "A licença-servidor (licença especial) é concedida ao servidor que completar quinze anos de efetivo exercício.", "opts": ["Certo", "Errado"], "a": 1, "art": "Art. 139", "tip": "Licença-servidor = a cada 5 anos (quinquênio), não 15 anos."}, {"banca": "QUADRIX", "bloco": "Arts. 66–179", "q": "O servidor tem direito a licença sem remuneração para acompanhar cônjuge ou companheiro servidor público federal que for deslocado para outro ponto do território nacional.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 133", "tip": "Acompanhar cônjuge servidor público deslocado: licença SEM remuneração."}, {"banca": "QUADRIX", "bloco": "Arts. 66–179", "q": "O servidor que obteve licença para tratar de interesses particulares terá interrompido, durante o período de afastamento, o cômputo do tempo de serviço para todos os efeitos legais.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 144", "tip": "Licença interesses particulares: sem remuneração e o tempo NÃO conta para fins de progressão, aposentadoria etc."}, {"banca": "CEBRASPE", "bloco": "Arts. 66–179", "q": "O servidor pode acumular o período de licença-servidor (licença-prêmio) com as férias do exercício para que sejam gozados em continuidade.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 139, §1º", "tip": "Licença-servidor pode ser acumulada com férias para gozo contínuo."}, {"banca": "CEBRASPE", "bloco": "Arts. 66–179", "q": "A concessão de licença para tratamento de saúde por prazo superior a trinta dias consecutivos depende de inspeção pelo serviço de perícia médica.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 131", "tip": "Licença saúde >30 dias: exige perícia médica."}, {"banca": "IADES", "bloco": "Arts. 66–179", "q": "O servidor em licença para tratamento de saúde pode ser convocado a qualquer momento pela Administração para reassumir suas funções, independentemente de manifestação médica.", "opts": ["Certo", "Errado"], "a": 1, "art": "Art. 131", "tip": "A cessação da licença saúde depende de laudo médico que ateste a recuperação, não por simples convocação administrativa."}, {"banca": "IBFC", "bloco": "Arts. 66–179", "q": "A licença por acidente em serviço ou doença profissional é concedida sem limitação de prazo, com remuneração integral.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 132", "tip": "Acidente em serviço: sem limite de prazo, com remuneração integral."}, {"banca": "QUADRIX", "bloco": "Arts. 66–179", "q": "O servidor em gozo de licença para tratar de saúde não poderá exercer qualquer atividade remunerada, ainda que em outro órgão.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 131, §§", "tip": "Licença saúde: vedado exercer atividade remunerada durante o afastamento."}, {"banca": "QUADRIX", "bloco": "Arts. 66–179", "q": "O adicional por tempo de serviço é calculado sobre o vencimento básico do servidor, à razão de um por cento por ano de efetivo exercício.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 82", "tip": "Anuênio = 1% por ano sobre o vencimento básico."}, {"banca": "CEBRASPE", "bloco": "Arts. 66–179", "q": "O servidor tem direito a cinco dias de ausência justificada do serviço, por ano, designados abono de ponto, quando não tiver sofrido falta injustificada ao longo do ano anterior.", "opts": ["Certo", "Errado"], "a": 1, "art": "Art. 151", "tip": "Abono de ponto: sem falta DURANTE O ANO CORRENTE (não ano anterior). O servidor que não faltou injustificadamente em determinado ano faz jus ao abono."}, {"banca": "CEBRASPE", "bloco": "Arts. 66–179", "q": "O direito ao abono de ponto extingue-se em trinta e um de dezembro do ano seguinte ao do período aquisitivo.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 151, §2º", "tip": "Abono de ponto: extingue em 31/12 do ANO SEGUINTE ao aquisitivo."}, {"banca": "IADES", "bloco": "Arts. 66–179", "q": "O servidor tem direito a assistência à saúde, por meio de plano de saúde ou ressarcimento de despesas médicas.", "opts": ["Certo", "Errado"], "a": 0, "art": "Arts. 110 e ss.", "tip": "Assistência à saúde: plano de saúde ou ressarcimento de despesas médicas."}, {"banca": "IADES", "bloco": "Arts. 66–179", "q": "A ajuda de custo não é devida ao servidor que retornar voluntariamente à sede de origem.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 102", "tip": "Ajuda de custo: devida nos afastamentos por interesse da Administração, não nos voluntários."}, {"banca": "IBFC", "bloco": "Arts. 66–179", "q": "O servidor em disponibilidade remunerada deve, ao ser aproveitado, entrar em exercício no prazo de trinta dias da comunicação.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 40, §1º", "tip": "Aproveitamento: 30 dias para entrar em exercício."}, {"banca": "QUADRIX", "bloco": "Arts. 66–179", "q": "O prazo para a Administração concluir a sindicância é de trinta dias, podendo ser prorrogado por mais trinta dias.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 214, §2º", "tip": "Sindicância: 30 + 30 dias."}, {"banca": "QUADRIX", "bloco": "Arts. 66–179", "q": "O prazo para conclusão do processo administrativo disciplinar (PAD) é de sessenta dias, prorrogável por igual período, a contar da data de sua instauração.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 217, §1º", "tip": "PAD: 60 + 60 dias."}, {"banca": "CEBRASPE", "bloco": "Arts. 66–179", "q": "O servidor pode requerer a qualquer tempo a revisão do processo disciplinar, quando surgirem fatos novos ou circunstâncias suscetíveis de justificar a inocência do punido.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 268", "tip": "Revisão do processo: pode ser pedida a qualquer tempo quando houver fatos novos."}, {"banca": "CEBRASPE", "bloco": "Arts. 66–179", "q": "O afastamento preventivo do servidor indiciado em processo administrativo disciplinar não pode ultrapassar sessenta dias, improrrogáveis.", "opts": ["Certo", "Errado"], "a": 1, "art": "Art. 222", "tip": "Afastamento preventivo = 60 dias, PRORROGÁVEL por mais 60 dias (60 + 60 = 120 dias máx)."}, {"banca": "IADES", "bloco": "Arts. 66–179", "q": "O prazo para apresentação da defesa escrita no processo administrativo disciplinar com apenas um acusado é de dez dias, prorrogável pelo dobro.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 250", "tip": "1 acusado: 10 dias, prorrogável por mais 10 (dobro)."}, {"banca": "IADES", "bloco": "Arts. 66–179", "q": "A penalidade de suspensão não poderá exceder noventa dias em se tratando de infrações do Grupo II.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 200, §1º, II", "tip": "Suspensão Grupo II: até 90 dias."}, {"banca": "IBFC", "bloco": "Arts. 66–179", "q": "O registro de penalidade de advertência será automaticamente cancelado após o decurso do prazo de três anos sem que o servidor tenha praticado nova infração.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 201", "tip": "Advertência: cancelamento em 3 anos sem nova infração."}, {"banca": "QUADRIX", "bloco": "Arts. 66–179", "q": "A prescrição da pretensão punitiva da Administração para as faltas punidas com demissão é de cinco anos.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 208, I", "tip": "Demissão/destituição/cassação: prescrição em 5 anos."}, {"banca": "QUADRIX", "bloco": "Arts. 66–179", "q": "A prescrição da pretensão punitiva da Administração para as faltas punidas com suspensão é de dois anos.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 208, II", "tip": "Suspensão: prescrição em 2 anos."}, {"banca": "CEBRASPE", "bloco": "Arts. 66–179", "q": "A prescrição da pretensão punitiva da Administração para as faltas punidas com advertência é de um ano.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 208, III", "tip": "Advertência: prescrição em 1 ano."}, {"banca": "CEBRASPE", "bloco": "Arts. 66–179", "q": "A absolvição criminal do servidor sempre impedirá a aplicação de sanção disciplinar pelo mesmo fato.", "opts": ["Certo", "Errado"], "a": 1, "art": "Art. 184", "tip": "Absolvição criminal só impede sanção disciplinar quando reconhecida a INEXISTÊNCIA DO FATO ou negada A AUTORIA. Insuficiência de provas não afasta a responsabilidade administrativa."}, {"banca": "IADES", "bloco": "Arts. 66–179", "q": "O direito de petição prescreve em cento e vinte dias nos casos não relativos a demissão, cassação ou interesse patrimonial.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 175, III", "tip": "120 dias: demais casos. 5 anos: demissão, cassação e interesse patrimonial."}, {"banca": "IADES", "bloco": "Arts. 66–179", "q": "O prazo para interposição de recurso administrativo é de trinta dias, contados da publicação ou ciência do ato.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 172", "tip": "Recurso e pedido de reconsideração = 30 dias."}, {"banca": "IBFC", "bloco": "Arts. 66–179", "q": "A revisão do processo disciplinar poderá ser promovida de ofício pela autoridade competente ou a requerimento do servidor ou de seus sucessores.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 268, §único", "tip": "Revisão: de ofício ou a requerimento do interessado ou seus sucessores."}, {"banca": "QUADRIX", "bloco": "Arts. 66–179", "q": "O servidor indiciado em processo administrativo disciplinar tem o direito de acompanhar o processo pessoalmente ou por intermédio de procurador.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 246", "tip": "Direito à ampla defesa: pessoalmente ou por procurador."}, {"banca": "QUADRIX", "bloco": "Arts. 66–179", "q": "O servidor que for exonerado por não ser aprovado no estágio probatório terá direito a indenização pela não conclusão do período probatório.", "opts": ["Certo", "Errado"], "a": 1, "art": "Art. 45", "tip": "Exoneração por reprovação no estágio probatório: sem direito a indenização."}, {"banca": "CEBRASPE", "bloco": "Arts. 66–179", "q": "O afastamento do servidor para exercício de mandato eletivo federal ou estadual será sem remuneração, podendo o servidor optar pela remuneração do cargo efetivo.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 55, III", "tip": "Mandato federal/estadual: afastado do cargo, com opção pela remuneração do cargo efetivo."}, {"banca": "CEBRASPE", "bloco": "Arts. 66–179", "q": "A licença para atividade política será concedida sem remuneração durante todo o período da campanha eleitoral, a contar do registro da candidatura.", "opts": ["Certo", "Errado"], "a": 1, "art": "Art. 137", "tip": "Com remuneração: do registro até 10 dias após eleição. Sem remuneração: da convenção até véspera do registro."}, {"banca": "IADES", "bloco": "Arts. 66–179", "q": "É permitida a acumulação da licença-servidor com as férias regulamentares para gozo ininterrupto.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 139, §1º", "tip": "Licença-servidor + férias = podem ser gozadas em continuidade."}, {"banca": "IADES", "bloco": "Arts. 66–179", "q": "A servidora gestante tem estabilidade provisória durante a gestação e até cinco meses após o parto, independentemente de ter sido aprovada ou não no estágio probatório.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 53", "tip": "Proteção da gestante: durante a gravidez e até 5 meses após o parto, independente da situação funcional."}, {"banca": "IBFC", "bloco": "Arts. 66–179", "q": "O servidor que tiver sido afastado preventivamente por mais de trinta dias terá direito ao ressarcimento da remuneração não recebida, caso absolvido ao final do processo.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 222", "tip": "Afastamento preventivo é sem prejuízo da remuneração — o servidor já recebe durante o afastamento."}, {"banca": "QUADRIX", "bloco": "Arts. 66–179", "q": "A denúncia anônima pode dar início à sindicância ou ao processo disciplinar quando acompanhada de elementos que permitam a apuração dos fatos.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 213", "tip": "Denúncia anônima: admitida quando há elementos para apuração (STJ)."}, {"banca": "QUADRIX", "bloco": "Arts. 66–179", "q": "O servidor condenado criminalmente por sentença com trânsito em julgado deverá ser demitido se a pena aplicada for privativa de liberdade, independentemente do prazo da pena.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 203, I", "tip": "Condenação criminal com trânsito em julgado → demissão (crime contra a Adm, improbidade e outros)."}, {"banca": "CEBRASPE", "bloco": "Arts. 66–179", "q": "A comissão processante responsável pelo processo disciplinar é composta por três servidores estáveis, sendo o presidente de nível hierárquico superior ao do indiciado.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 231", "tip": "Comissão disciplinar: 3 servidores estáveis. Presidente: nível superior ao indiciado."}, {"banca": "CEBRASPE", "bloco": "Arts. 66–179", "q": "O processo administrativo disciplinar pode ser instaurado apenas por portaria, não sendo admitida outra forma de instauração.", "opts": ["Certo", "Errado"], "a": 1, "art": "Art. 231", "tip": "O PAD pode ser instaurado por portaria ou por outra forma prevista em lei (não exclusivamente por portaria)."}, {"banca": "IADES", "bloco": "Arts. 66–179", "q": "A sindicância pode resultar em arquivamento, instauração de PAD ou aplicação das penalidades de advertência e suspensão de até trinta dias.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 214", "tip": "Sindicância: arquivamento, abertura de PAD ou penalidade de advertência/suspensão até 30 dias."}, {"banca": "IADES", "bloco": "Arts. 66–179", "q": "O servidor indiciado em processo disciplinar será citado para apresentar defesa escrita no prazo de dez dias, quando houver apenas um acusado.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 250", "tip": "1 acusado: 10 dias para defesa escrita."}, {"banca": "IBFC", "bloco": "Arts. 66–179", "q": "Na hipótese de dois ou mais indiciados, o prazo para apresentação de defesa escrita será de vinte dias.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 250", "tip": "2+ acusados: 20 dias para defesa escrita."}, {"banca": "QUADRIX", "bloco": "Arts. 66–179", "q": "O prazo para o julgamento do processo disciplinar é de vinte dias, a contar do recebimento dos autos pela autoridade julgadora.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 256", "tip": "Julgamento do PAD: 20 dias do recebimento dos autos."}, {"banca": "QUADRIX", "bloco": "Arts. 66–179", "q": "A revisão do processo disciplinar não pode resultar em agravamento da penalidade aplicada.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 270", "tip": "Revisão: não pode agravar a penalidade (non reformatio in pejus)."}, {"banca": "CEBRASPE", "bloco": "Arts. 66–179", "q": "A pena de suspensão aplicada ao servidor público do DF pode ser convertida em multa de cinqüenta por cento por dia de vencimento, ficando o servidor obrigado a permanecer em serviço.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 200, §2º", "tip": "Suspensão pode ser convertida em multa (50%/dia), com manutenção em serviço."}, {"banca": "CEBRASPE", "bloco": "Arts. 66–179", "q": "A penalidade de demissão aplicada a servidor estável pressupõe processo administrativo disciplinar com observância do contraditório e ampla defesa.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 230 e CF/88 art. 5º, LV", "tip": "Demissão de estável: PAD com contraditório e ampla defesa obrigatórios."}, {"banca": "IADES", "bloco": "Arts. 66–179", "q": "A penalidade de advertência será aplicada por escrito, nos casos de violação de proibição constante da LC 840/2011 ou de inobservância de dever funcional.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 197", "tip": "Advertência: aplicada por escrito para infrações leves."}, {"banca": "IADES", "bloco": "Arts. 66–179", "q": "A penalidade de suspensão pode ser aplicada em caso de reincidência de falta punida com advertência.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 198", "tip": "Reincidência na falta punível com advertência: suspensão."}, {"banca": "IBFC", "bloco": "Arts. 66–179", "q": "A demissão e a cassação de aposentadoria ou disponibilidade, nos casos de improbidade administrativa, são de competência exclusiva do Governador do Distrito Federal.", "opts": ["Certo", "Errado"], "a": 1, "art": "Art. 258", "tip": "Demissão em casos de improbidade e infrações graves: competência do Governador. Porém em outros casos pode ser de outras autoridades — não é exclusiva do Governador para todos os casos."}, {"banca": "QUADRIX", "bloco": "Arts. 66–179", "q": "O servidor afastado preventivamente para apuração de irregularidades continuará recebendo sua remuneração normalmente.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 222", "tip": "Afastamento preventivo: sem prejuízo da remuneração."}, {"banca": "QUADRIX", "bloco": "Arts. 66–179", "q": "A responsabilidade civil do servidor decorrente de ato doloso ou culposo fica excluída quando a Administração já ressarciu o erário em ação regressiva.", "opts": ["Certo", "Errado"], "a": 1, "art": "Art. 185", "tip": "A responsabilidade civil do servidor não é excluída pelo ressarcimento — a ação regressiva é o instrumento pelo qual a Administração recupera o que pagou e cobra do servidor."}, {"banca": "CEBRASPE", "bloco": "Arts. 66–179", "q": "A responsabilidade administrativa do servidor será afastada no caso de absolvição criminal que reconheça a inexistência do fato ou negue a autoria.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 184", "tip": "Inexistência do fato ou negativa de autoria na esfera criminal = afasta a responsabilidade administrativa."}, {"banca": "CEBRASPE", "bloco": "Arts. 66–179", "q": "A responsabilidade civil do servidor público resulta da prática de ato doloso ou culposo que cause prejuízo ao erário ou a terceiros.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 185", "tip": "Responsabilidade civil: dolo ou culpa → prejuízo ao erário ou terceiros."}, {"banca": "IADES", "bloco": "Arts. 66–179", "q": "O servidor público deve restituir os danos que causar ao erário, podendo o ressarcimento ser descontado em parcelas de sua remuneração.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 186", "tip": "Ressarcimento ao erário: pode ser parcelado, descontado da remuneração."}, {"banca": "IADES", "bloco": "Arts. 66–179", "q": "O servidor que cometer crime contra a Administração Pública será demitido, mesmo que o crime seja punido com pena privativa de liberdade de curta duração.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 203, I", "tip": "Crime contra a Adm Pública → demissão, independente da duração da pena."}, {"banca": "IBFC", "bloco": "Arts. 66–179", "q": "O servidor condenado à pena privativa de liberdade por sentença definitiva será demitido do cargo público independentemente de processo administrativo disciplinar.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 203, I", "tip": "Condenação criminal definitiva = demissão, independente de PAD."}, {"banca": "QUADRIX", "bloco": "Arts. 66–179", "q": "A desídia habitual no exercício das atribuições do cargo é causa de demissão do servidor público.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 203, VII", "tip": "Desídia habitual = demissão."}, {"banca": "QUADRIX", "bloco": "Arts. 66–179", "q": "O servidor que revelar segredo do qual se apropriou em razão do cargo estará sujeito à pena de demissão.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 203, IX", "tip": "Revelação de segredo = demissão."}, {"banca": "CEBRASPE", "bloco": "Arts. 66–179", "q": "A infração grave que justifica a demissão do servidor inclui a acumulação ilegal de cargos, empregos ou funções públicas, após notificação, quando o servidor não optou por um dos cargos no prazo legal.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 203, XIII", "tip": "Acumulação ilegal após notificação e não opção = demissão."}, {"banca": "CEBRASPE", "bloco": "Arts. 66–179", "q": "A advocacia administrativa, entendida como o patrocínio de causa de interesse privado perante a Administração, com o recebimento de vantagem, configura apenas infração administrativa, não chegando a ser um tipo penal.", "opts": ["Certo", "Errado"], "a": 1, "art": "Art. 203, XIV", "tip": "Advocacia administrativa é tanto infração administrativa (demissão) quanto crime previsto no Código Penal (art. 321)."}, {"banca": "IADES", "bloco": "Arts. 66–179", "q": "A penalidade disciplinar de demissão independe de proporcionalidade quando se tratar das infrações graves previstas expressamente na LC 840/2011.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 203", "tip": "Para as infrações graves listadas no art. 203, a penalidade é demissão, sem margem de proporcionalidade (são casos vinculados)."}, {"banca": "IADES", "bloco": "Arts. 66–179", "q": "A penalidade aplicada em virtude de processo administrativo disciplinar pode ser revista de ofício pela autoridade competente, desde que surjam fatos novos que justifiquem tal revisão.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 268", "tip": "Revisão: pode ser de ofício ou a requerimento quando surgem fatos novos."}, {"banca": "IBFC", "bloco": "Arts. 66–179", "q": "Na revisão do processo disciplinar, é possível a reformatio in pejus, ou seja, o agravamento da penalidade originalmente aplicada.", "opts": ["Certo", "Errado"], "a": 1, "art": "Art. 270", "tip": "Revisão: PROIBIDA a reformatio in pejus — não pode agravar a pena."}, {"banca": "QUADRIX", "bloco": "Arts. 66–179", "q": "A abertura do processo disciplinar prescinde da existência de indícios da prática de infração funcional, bastando a mera suspeita.", "opts": ["Certo", "Errado"], "a": 1, "art": "Art. 213", "tip": "Para instaurar PAD é necessária a existência de elementos que indiquem a irregularidade — mera suspeita sem fundamento não basta."}, {"banca": "QUADRIX", "bloco": "Arts. 66–179", "q": "O indiciado em processo disciplinar que não constituir defensor terá defesa dativa nomeada pela autoridade instauradora, assegurando-se a ampla defesa.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 248", "tip": "Defesa dativa: se o indiciado não constituir defensor, a autoridade nomeará um."}, {"banca": "CEBRASPE", "bloco": "Arts. 66–179", "q": "A lei que rege os servidores do Distrito Federal prevê que o servidor tem o dever de lealdade às instituições a que serve.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 56, I", "tip": "Lealdade às instituições é um dos deveres funcionais expressos na LC 840/2011."}, {"banca": "CEBRASPE", "bloco": "Arts. 66–179", "q": "O servidor público tem o direito de recorrer a instância superior no prazo de trinta dias, a contar da publicação ou ciência do ato recorrido.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 172", "tip": "Recurso = 30 dias da publicação ou ciência."}, {"banca": "IADES", "bloco": "Arts. 66–179", "q": "O servidor tem o dever de observar as normas legais e regulamentares, bem como as ordens emanadas de suas chefias, salvo quando manifestamente ilegais.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 56, II", "tip": "Dever de obediência às ordens, exceto quando manifestamente ilegais."}, {"banca": "IADES", "bloco": "Arts. 66–179", "q": "O servidor que não obs nto.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 4º e CF/88 art. 61", "tip": "Criação de cargos: somente por lei (CF/88, art. 61, §1º, II, a). O decreto apenas organiza, não cria."}, {"banca": "CEBRASPE", "bloco": "Arts. 66–179", "q": "O servidor público que tiver seu cargo transformado em virtude de reorganização administrativa terá assegurado o seu retorno ao cargo anterior, se não aceitar o novo cargo.", "opts": ["Certo", "Errado"], "a": 1, "art": "Art. 42", "tip": "Na readaptação/transformação, se o servidor não puder exercer o cargo transformado e não houver vaga, pode ser posto em disponibilidade — não há garantia de retorno ao cargo anterior."}, {"banca": "IADES", "bloco": "Arts. 66–179", "q": "O servidor terá direito ao afastamento remunerado para participar de congressos, simpósios, conferências ou cursos, quando de interesse da Administração.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 145", "tip": "Afastamento para eventos de capacitação: com remuneração, quando do interesse da Administração."}, {"banca": "IADES", "bloco": "Arts. 66–179", "q": "O servidor afastado para participar de programa de pós-graduação stricto sensu no país terá mantida sua remuneração integral.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 147", "tip": "Afastamento para pós-graduação stricto sensu no país: com remuneração."}, {"banca": "IBFC", "bloco": "Arts. 66–179", "q": "O servidor público efetivo tem direito à estabilidade no cargo, o que impede sua demissão sem processo administrativo disciplinar assegurador do contraditório e da ampla defesa.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 32 e CF/88 art. 41", "tip": "Estabilidade: demissão só por PAD com contraditório e ampla defesa, ou processo judicial ou avaliação de desempenho."}, {"banca": "QUADRIX", "bloco": "Arts. 66–179", "q": "O servidor em gozo de licença-maternidade não poderá ser demitido, salvo por falta grave apurada em processo administrativo disciplinar.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 53", "tip": "Proteção da gestante/puérpera: não pode ser exonerada de ofício até 5 meses após o parto (efetivas) — demissão por falta grave exige PAD."}, {"banca": "QUADRIX", "bloco": "Arts. 66–179", "q": "O servidor nomeado para cargo em comissão tem o direito de retornar ao cargo efetivo ao ser exonerado do cargo em comissão.", "opts": ["Certo", "Errado"], "a": 0, "art": "Art. 9º, §1º", "tip": "Servidor efetivo nomeado para CC: ao ser exonerado do CC, retorna ao cargo efetivo."}, {"banca": "FCC", "bloco": "Arts. 66–179", "q": "O servidor exonerado a pedido, antes de adquirir estabilidade, perde o direito ao recebimento de qualquer indenização ou pecúnia referente ao período trabalhado.", "opts": ["Certo", "Errado"], "a": 1, "art": "Art. 45", "tip": "Exoneração a pedido: o servidor tem direito a saldo de salário, férias proporcionais e 13º proporcional — não perde tudo."}];
let deck=[], idx=0, score=0, total=0, wrongs=[], timer=null, secs=30;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function getChecked(cls){return [...document.querySelectorAll('.'+cls+' input:checked')].map(i=>i.value);}

function startGame(mode){
  const bancas=getChecked('filter-bancas');
  const blocos=getChecked('filter-blocos');
  let source = mode==='wrongs' ? wrongs : QUESTOES.filter(q=>bancas.includes(q.banca)&&blocos.includes(q.bloco));
  deck=shuffle([...source]);
  if(!deck.length){alert('Nenhuma questão encontrada com os filtros selecionados!');return;}
  idx=0;score=0;total=deck.length;wrongs=[];
  document.getElementById('setup').style.display='none';
  document.getElementById('game').style.display='block';
  document.getElementById('result').style.display='none';
  nextQ();
}

function nextQ(){
  if(idx>=deck.length){showResult();return;}
  const q=deck[idx];
  document.getElementById('num-badge').textContent=`${idx+1} / ${total}`;
  document.querySelector('.badge-banca').textContent=q.banca;
  document.querySelector('.badge-bloco').textContent=q.bloco;
  document.querySelector('.question').textContent=q.q;
  const optsDiv=document.querySelector('.opts');
  optsDiv.innerHTML='';
  q.opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt'; b.textContent=o;
    b.onclick=()=>answer(i,q);
    optsDiv.appendChild(b);
  });
  document.querySelector('.feedback').className='feedback';
  document.querySelector('.btn-next').className='btn-next';
  startTimer();
}

function startTimer(){
  clearInterval(timer);
  secs=30;
  const bar=document.getElementById('timer-bar');
  bar.style.width='100%'; bar.style.background='#3fb950';
  bar.style.transition='none';
  setTimeout(()=>{ bar.style.transition='width 1s linear, background .5s'; },50);
  timer=setInterval(()=>{
    secs--;
    const pct=secs/30*100;
    bar.style.width=pct+'%';
    if(pct<40) bar.style.background='#d29922';
    if(pct<20) bar.style.background='#f85149';
    if(secs<=0){clearInterval(timer);timeout();}
  },1000);
}

function timeout(){
  const q=deck[idx];
  const btns=document.querySelectorAll('.opt');
  btns.forEach(b=>b.disabled=true);
  btns[q.a].classList.add('correct');
  wrongs.push(q);
  showFeedback(false,q);
}

function answer(i,q){
  clearInterval(timer);
  const btns=document.querySelectorAll('.opt');
  btns.forEach(b=>b.disabled=true);
  const ok=(i===q.a);
  btns[i].classList.add(ok?'correct':'wrong');
  if(!ok){btns[q.a].classList.add('correct');wrongs.push(q);}
  if(ok) score++;
  showFeedback(ok,q);
}

function showFeedback(ok,q){
  const fb=document.querySelector('.feedback');
  fb.innerHTML=`<div class="art-ref">${q.art}</div><div>${q.tip}</div>`;
  fb.className='feedback show '+(ok?'ok':'nok');
  document.querySelector('.btn-next').className='btn-next show';
  document.getElementById('score-val').textContent=score;
}

function nextQuestion(){idx++;nextQ();}

function showResult(){
  document.getElementById('game').style.display='none';
  const res=document.getElementById('result');
  res.style.display='block';
  const pct=Math.round(score/total*100);
  res.querySelector('h2').textContent=pct>=80?'Excelente! 🎯':pct>=60?'Bom trabalho! 💪':'Continue praticando! 📚';
  res.querySelector('.score-big').textContent=`${score}/${total}`;
  res.querySelector('.score-label').textContent=`${pct}% de acerto`;
  document.getElementById('stat-wrong').textContent=total-score;
  document.getElementById('stat-pct').textContent=pct+'%';
  document.getElementById('btn-wrongs').style.display=wrongs.length?'inline-block':'none';
}

function retryAll(){document.getElementById('result').style.display='none';document.getElementById('setup').style.display='block';}
function retryWrongs(){document.getElementById('result').style.display='none';startGame('wrongs');}
</script>
</body>
</html>
